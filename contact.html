<!DOCTYPE html>
<html lang="en" class="no-js">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Contact | GROAGRI ORGANICS</title>
  <meta name="description" content="Contact GROAGRI ORGANICS for prices, bulk orders, dealership and crop advice. Call or WhatsApp +91 89251 84969.">
  <meta name="theme-color" content="#082a1f">
  <link rel="icon" href="images/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Cormorant+Garamond:ital,wght@1,500;1,600&family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+Tamil:wght@400;500;600;700&family=Noto+Serif+Tamil:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="contact" data-title="meta.title.contact">

<main>
  <section class="page-banner">
    <div class="bg" style="background-image:url(images/crops/paddy.jpg)"></div>
    <div class="container">
      <span class="eyebrow" data-i18n="tagline">Nourishing Crops. Nurturing Growth.</span>
      <h1 data-i18n="contact.banner.title">Contact Us</h1>
      <p data-i18n="contact.banner.lead"></p>
      <div class="crumbs"><a href="index.html" data-i18n="nav.home">Home</a> / <span data-i18n="nav.contact">Contact</span></div>
    </div>
  </section>

  <section class="section">
    <div class="container contact-grid">
      <div class="reveal">
        <span class="eyebrow" data-i18n="contact.eyebrow">Get In Touch</span>
        <h2 data-i18n="contact.title">We’d Love to Hear From You</h2>
        <p class="lead" style="margin:14px 0 30px" data-i18n="contact.lead"></p>

        <div class="info-item">
          <span class="medallion"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg></span>
          <div><h4 data-i18n="contact.address">Address</h4><p data-i18n-html="contact.addressVal"></p></div>
        </div>
        <div class="info-item">
          <span class="medallion"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg></span>
          <div><h4 data-i18n="contact.phone">Phone / WhatsApp</h4><p><a href="tel:+918925184969">+91 89251 84969</a></p></div>
        </div>
        <div class="info-item">
          <span class="medallion"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20M12 2a15 15 0 0 0 0 20"/></svg></span>
          <div><h4 data-i18n="contact.web">Website</h4><p><a href="https://www.groagriorganics.in" target="_blank" rel="noopener">www.groagriorganics.in</a></p></div>
        </div>
        <div class="info-item">
          <span class="medallion"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span>
          <div><h4 data-i18n="contact.hours">Working Hours</h4><p data-i18n-html="contact.hoursVal"></p></div>
        </div>
      </div>

      <div class="form-card reveal" style="--rd:.1s">
        <h3 data-i18n="form.title">Send an Enquiry</h3>
        <form id="enquiry-form">
          <div class="form-row">
            <div class="form-group">
              <label for="name" data-i18n="form.name">Your Name *</label>
              <input type="text" id="name" name="name" required autocomplete="name" data-i18n-ph="form.name.ph">
            </div>
            <div class="form-group">
              <label for="phone" data-i18n="form.phone">Phone Number *</label>
              <input type="tel" id="phone" name="phone" required pattern="[0-9+ ]{10,15}" autocomplete="tel" data-i18n-ph="form.phone.ph">
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="location" data-i18n="form.location">Village / Town</label>
              <input type="text" id="location" name="location" data-i18n-ph="form.location.ph">
            </div>
            <div class="form-group">
              <label for="product" data-i18n="form.product">Product</label>
              <select id="product" name="product"></select>
            </div>
          </div>
          <div class="form-group">
            <label for="message" data-i18n="form.message">Message</label>
            <textarea id="message" name="message" rows="5" data-i18n-ph="form.message.ph"></textarea>
          </div>
          <button type="submit" class="btn btn-gold"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.5 14.4c-.3-.1-1.8-.9-2-1-.3-.1-.5-.1-.7.1-.2.3-.8 1-.9 1.2-.2.2-.3.2-.6.1-.3-.1-1.3-.5-2.4-1.5-.9-.8-1.5-1.8-1.7-2.1-.2-.3 0-.5.1-.6l.4-.5c.2-.2.2-.3.3-.5.1-.2 0-.4 0-.5l-.9-2.2c-.2-.6-.5-.5-.7-.5h-.6c-.2 0-.5.1-.8.4-.3.3-1 1-1 2.5s1.1 2.9 1.2 3.1c.1.2 2.1 3.2 5.1 4.5 2.5 1 3 .8 3.6.8.6-.1 1.8-.7 2-1.4.2-.7.2-1.3.2-1.4-.1-.2-.3-.3-.6-.4zM12 2a10 10 0 0 0-8.6 15l-1.4 5 5.1-1.3A10 10 0 1 0 12 2z"/></svg><span data-i18n="form.submit">Send via WhatsApp</span></button>
          <p class="form-note" data-i18n="form.note"></p>
          <div class="form-success" id="form-success" role="status" data-i18n="form.success"></div>
        </form>
      </div>
    </div>

    <div class="container">
      <div class="map-wrap reveal">
        <iframe src="https://maps.google.com/maps?q=Kaniyur%2C%20Tamil%20Nadu&amp;z=13&amp;output=embed" title="Map – Kaniyur, Tamil Nadu" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
      </div>
    </div>
  </section>
</main>

<script src="js/data.js"></script>
<script src="js/i18n.js"></script>
<script src="js/main.js"></script>
</body>
</html>
